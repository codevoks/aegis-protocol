name: CI

# Every required job runs with no secrets configured (docs/zero-cost-demo.md §7): no RPC
# endpoint, no API key, no faucet. If a required check ever needs one, that is a bug in
# the check, not something to work around here.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  guards:
    name: guards (grep-based invariant checks)
    # Phase 11's scripts/check-cu-regression.sh is the first guard script that needs the real
    # compiled program (`tests/bench.rs`'s Mollusk harness loads target/deploy/aegis.so via
    # `include_bytes!`) -- this job now runs after build-and-test and restores its cache
    # (same key) to reuse that artifact instead of building it a second time.
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Restore the build-and-test job's cache (target/deploy/aegis.so, cargo registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            ~/.avm
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - name: Verify the cached program artifact is present
        run: test -f target/deploy/aegis.so
      - name: Run all guard scripts
        run: |
          set -e
          for script in scripts/check-*.sh; do
            echo "::group::$script"
            "$script"
            echo "::endgroup::"
          done

  build-and-test:
    name: anchor build, aegis-math tests, workspace tests, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            ~/.avm
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Agave (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install avm and pinned Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/avm" install 1.2.0
          "$HOME/.cargo/bin/avm" use 1.2.0

      - name: Generate a local wallet (no funds, no secret — offline keypair only)
        run: solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json

      - name: anchor build (also generates the IDL)
        run: anchor build

      - name: Verify the IDL was generated
        run: test -f target/idl/aegis.json

      - name: Build the labs/ programs cargo test --workspace needs
        # Phase 13 finding: only `aegis.so` was ever built explicitly here. `cargo test
        # --workspace` also needs example_liquidator.so/hostile_callback.so (Phase 8's
        # tests/phase8_hostile_callback.rs) and vault_anchor.so/vault_native.so/
        # vault_pinocchio.so (Phase 11's labs/vault-*/tests/basic.rs), all via `include_bytes!`.
        # This job's persistent cache (below) made that invisible on every run since whichever
        # one first happened to build them locally before this step existed -- a genuinely
        # cache-cold run (a fresh Cargo.lock hash, or the cache evicted) would otherwise fail
        # with "No such file or directory", exactly as Phase 13's clean-clone reproduction test
        # found locally. Matches `make build` exactly, kept as explicit steps here (rather than
        # invoking `make build`, which would re-run `anchor build` a second time) to avoid a
        # second, redundant `anchor build` invocation in the same job.
        run: |
          cargo build-sbf --manifest-path labs/example-liquidator/Cargo.toml
          cargo build-sbf --manifest-path labs/hostile-callback/Cargo.toml
          cargo build-sbf --manifest-path labs/vault-anchor/Cargo.toml
          cargo build-sbf --manifest-path labs/vault-native/Cargo.toml
          cargo build-sbf --manifest-path labs/vault-pinocchio/Cargo.toml

      - name: cargo test -p aegis-math
        run: cargo test -p aegis-math

      - name: cargo test --workspace (includes the offline LiteSVM smoke test)
        run: cargo test --workspace
