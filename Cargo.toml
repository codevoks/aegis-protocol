[package]
name = "aegis-workspace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workspace root; hosts the zero-cost offline smoke test (tests/smoke.rs)"

[workspace]
resolver = "2"
members = [
    "programs/aegis",
    "crates/aegis-math",
    "crates/aegis-test-kit",
    "labs/example-liquidator",
    "labs/hostile-callback",
]

[workspace.package]
edition = "2021"
# Deliberately below the host rustc (1.98.1, verified in Phase 1): `cargo-build-sbf`
# compiles on-chain code with Solana's bundled platform-tools rustc (1.95.0-dev at time
# of writing), which enforces this crate's declared MSRV against itself, not the host
# compiler. Setting this above that bundled version breaks `anchor build` outright.
rust-version = "1.85.0"

[dev-dependencies]
aegis = { path = "programs/aegis" }
aegis-math = { path = "crates/aegis-math" }
aegis-test-kit = { path = "crates/aegis-test-kit" }
# Phase 8: `cpi` feature (`no-entrypoint`) so these compile as ordinary libraries here rather than
# pulling in a second `entrypoint!` into the test binary -- the tests load their real, separately
# built `.so` bytes into LiteSVM directly; this dependency exists only for typed `ID`/
# `instruction::*`/`accounts::*` access when building instructions against them.
example-liquidator = { path = "labs/example-liquidator", features = ["cpi"] }
hostile-callback = { path = "labs/hostile-callback", features = ["cpi"] }
anchor-lang = "1.2.0"
litesvm = "0.16"
# Pinned to the major versions litesvm 0.16.0 itself resolves (verified via its own
# Cargo.toml), so `VersionedTransaction` and friends are the same type on both sides.
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-signer = "3"
solana-keypair = "3"
solana-pubkey = "4"
solana-account = "4"
solana-instruction = "3"
solana-instruction-error = "2"
solana-transaction-error = "3"
# Same major line litesvm 0.16.0 itself resolves (`~3.1.1`, verified via its own Cargo.toml) --
# used only in tests, to warp the sysvar Clock forward without any real wall-clock waiting
# (docs/phases/phase-04-lending.md "One-year dormant market test": "Do not use real wall-clock
# waiting").
solana-clock = "3"
# Phase 8, tests/network/jupiter_route.rs (N-JUP-01) ONLY: parses the real Jupiter Swap API's JSON
# responses. Already a transitive dependency of this workspace (verified in Cargo.lock before
# adding it directly) -- promoting it to a direct dev-dependency adds zero new crates to the
# supply chain. The HTTP calls themselves shell out to `curl` (already required by `setup`'s own
# toolchain expectations) rather than adding an HTTP client crate, per AGENTS.md §10's preference
# for the smallest dependency footprint that does the job.
serde_json = "1"
# Phase 10, tests/fuzz/ ONLY: the stateful invariant fuzzer's seeded action/amount generator.
# `rand 0.8.8` is already resolved in Cargo.lock (a transitive dependency of `aegis-math`'s own
# `proptest` dev-dependency), so promoting it to a direct dev-dependency here adds zero new crates
# to the supply chain. `StdRng::seed_from_u64` gives the reproducible-from-a-seed property
# `phase-10-security.md` requires ("all keypairs and the RNG are seeded; every failure must be
# reproducible and shrinkable from its seed") -- never `rand::thread_rng()` anywhere in the fuzzer.
rand = "0.8"

# overflow-checks = true is the single most important line in this file (T-16). Release
# builds do not check arithmetic overflow by default; without this, the entire arithmetic
# safety argument in docs/economic-model.md is void in the deployed artifact.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
