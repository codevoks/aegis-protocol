[package]
name = "aegis-test-kit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local, offline LiteSVM test fixtures for Aegis Protocol"
license = "Apache-2.0"

[dependencies]
# The program under test: test-kit builds real instructions against it and decodes its accounts.
# Test code depending on product code is the one allowed direction (architecture.md §3: "No
# module imports aegis-test-kit" — never the reverse).
aegis = { path = "../../programs/aegis" }
aegis-math = { path = "../aegis-math" }
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
litesvm = "0.16"
solana-keypair = "3"
# 4.x re-exports `Pubkey` as a plain alias of `solana_address::Address` (the type litesvm's
# public API now uses directly), so this must track litesvm's own major line, not "3".
solana-pubkey = "4"
solana-signer = "3"
solana-instruction = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-account = "4"
solana-system-interface = "3"
solana-program-option = "3"
spl-token-interface = "2"
spl-token-2022-interface = "2"
solana-instruction-error = "2"
solana-transaction-error = "3"
solana-program-pack = "3"
# Same major line litesvm 0.16.0 itself resolves (`~3.1.1`) -- used by the Phase 4 demo to warp
# the sysvar Clock without any real wall-clock waiting.
solana-clock = "3"
# Real SDK types for `pyth_fixture.rs` -- byte-exact PriceUpdateV2 construction against the actual
# crate's own AnchorSerialize/Discriminator impls, never a hand-rolled layout guess (ADR-0008).
pyth-solana-receiver-sdk = "2.0.0"
# `borrow`/`withdraw_collateral`'s oracle-validated path (Phase 5) genuinely needs more than the
# default 200,000 CU: two PriceUpdateV2 deserializations plus several 256-bit mul_div_* divisions
# (accrual, share conversion, valuation, LTV check) -- a real client, same as this test harness,
# must request a higher compute unit limit via a standard ComputeBudget instruction. This is a
# resource-allocation concern, not a security check; INV-RES-01's 200k-budget measurement is
# explicitly Phase 11 (Performance) scope. Same major line already resolved transitively (verified
# in Cargo.lock).
solana-compute-budget-interface = "3"
