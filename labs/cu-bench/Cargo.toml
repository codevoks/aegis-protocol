[package]
name = "cu-bench"
version = "0.1.0"
description = "Phase 11 lab: CU comparison of the same custody primitive across vault-anchor, vault-native, and vault-pinocchio (docs/adr/0003-native-pinocchio-as-labs.md)"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
vault-anchor = { path = "../vault-anchor" }
vault-native = { path = "../vault-native" }
vault-pinocchio = { path = "../vault-pinocchio" }
anchor-lang = "1.2.0"
mollusk-svm = "0.15.1"
mollusk-svm-programs-token = "0.15.1"
litesvm = "0.16"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-keypair = "3"
solana-signer = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-program-pack = "3"
solana-system-interface = "3"
spl-token-interface = "2"
