[package]
name = "vault-anchor"
version = "0.1.0"
description = "Phase 11 lab: the Aegis custody primitive (init/deposit/withdraw a vault PDA) in Anchor 1.x -- the production-idiom baseline for labs/cu-bench"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vault_anchor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
# `token_2022` is enabled only because Anchor's `#[account(init, token::mint = ..., token::
# authority = ...)]` convenience constraint macro unconditionally expands through
# `anchor_spl::token_interface` regardless of which token program feature is actually used --
# this lab still only ever constructs plain `anchor_spl::token::{Token, TokenAccount, Mint}`
# types and CPIs, classic SPL Token only (see this crate's own lib.rs doc comment on scope).
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
litesvm = "0.16"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-instruction = "3"
solana-program-pack = "3"
solana-system-interface = "3"
spl-token-interface = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
