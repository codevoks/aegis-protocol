[package]
name = "vault-native"
version = "0.1.0"
description = "Phase 11 lab: the Aegis custody primitive (init/deposit/withdraw a vault PDA) in plain solana-program -- manual account parsing, manual validation, manual serialization, no Anchor"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vault_native"

# No-op features so `entrypoint!`'s internal `cfg(feature = "custom-heap"/"custom-panic")` checks
# are declared rather than "unexpected" under `-D warnings` (same pattern as
# labs/vault-anchor/Cargo.toml).
[features]
default = []
custom-heap = []
custom-panic = []

[dependencies]
# Pinned to "4" (not the newest published major, "5") because this workspace's Cargo.lock already
# resolves anchor-lang/anchor-spl (via labs/vault-anchor) to a dependency graph -- solana-pubkey
# 4.2.1, solana-instruction 3.4.1, solana-account-info 3.1.1, solana-program-pack 3.1.0 -- that
# solana-program 4.0.0 (already present in the lock, pulled by an oracle SDK) resolves to exactly.
# Using "5" would add a second, divergent copy of the whole solana-* sub-crate tree instead of
# reusing what is already there.
solana-program = "4"
# Matches labs/vault-anchor/Cargo.toml's dev-dependency exactly, for the same reason.
spl-token-interface = "2"
# solana-program 4.x no longer bundles `system_instruction`/`system_program` -- verified against
# its own crate docs (docs/ecosystem-research.md §15's "verify, do not remember" discipline).
# Pinned to "3" to match the version this workspace's Cargo.lock already resolves elsewhere.
solana-system-interface = { version = "3", features = ["bincode"] }

[dev-dependencies]
litesvm = "0.16"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-instruction = "3"
solana-program-pack = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
