[package]
name = "aegis"
version = "0.1.0"
description = "Aegis Protocol on-chain program"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# Required in Anchor 1.x or IDL generation silently breaks (see docs/ecosystem-research.md §1).
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Anchor re-exports what a program needs of solana-program; do not add solana-program
# directly (it causes crate-version conflicts and Anchor warns on it).
anchor-lang = "1.2.0"
# token_interface accepts either SPL Token or Token-2022 behind one type (token-compatibility.md
# §5.1); token_2022 extension parsing is needed by token/policy.rs for the positive allowlist.
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
aegis-math = { path = "../../crates/aegis-math" }
# The official Pyth SDK for reading pull-oracle PriceUpdateV2 accounts (docs/oracle-design.md,
# ADR-0008, docs/phases/phase-05-oracle.md). Required, not optional: the frozen oracle
# architecture is "a real Pyth adapter" against the actual account layout, never a hand-rolled
# reimplementation of it. Version and anchor-lang compatibility verified directly from crates.io
# and the crate's own source (docs/ecosystem-research.md RV-3/RV-4) -- maintained by Pyth Data
# Association, `anchor-lang = "^1.0.2"` is satisfied by this workspace's anchor-lang 1.2.0.
pyth-solana-receiver-sdk = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
